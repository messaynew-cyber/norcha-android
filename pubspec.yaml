name: norcha_print
description: "Norcha Print — photo printing in Bole, Addis Ababa. Live prices, Ethiopian holiday deadlines, and a quote that works offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8
  shared_preferences: ^2.3.2
  # Photo picking for the live /api/upload flow. The website uses a file input;
  # the app needs the real gallery, including HEIC straight off the camera roll.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

  # 🔴 FONTS ARE BUNDLED, NOT FETCHED — the comment in app_theme.dart has
  # always claimed this, but `fonts:` was never declared and assets/fonts did
  # not exist. Every family the app asked for was therefore resolved against
  # whatever the device happened to have, which is not something a shop counter
  # should depend on.
  #
  # All three are the real Google Fonts variable files (weight axis intact), so
  # one file per family covers every weight the app uses.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
    - family: Noto Serif Ethiopic
      fonts:
        - asset: assets/fonts/NotoSerifEthiopic.ttf
