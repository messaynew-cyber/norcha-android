# Norcha Print — build + verify.
#
# 🔴 THE PHONE AUTHORS, GITHUB COMPILES.
# This Redmi is ARM64 and Flutter only ships an x86_64 Linux Dart VM, so
# `flutter --version` dies with "Exec format error" locally. There is no ARM64
# tarball — it is a missing artifact, not a bug to fix. So every APK in this
# repo is produced here, on an ubuntu-latest runner.
#
# Job order matters: cheap proof first, expensive artifact second. A broken
# contract test should fail in 40 seconds, not after a 6-minute APK build.

name: Luxury Build

on:
  push:
    # 🔴 pricing-real IS THE LIVE BRANCH. It was in NO workflow's trigger
    # list, which meant the branch holding all the current work only ever
    # built when a human remembered to dispatch it by hand. That is how a
    # fix ends up pushed, green, and still not on the phone.
    # Wildcards as well as names: a new working branch must never be invisible
    # to CI just because nobody remembered to enumerate it. See test.yml.
    branches:
      - main
      - pricing-real
      - 'fix-*'
      - 'fix/**'
      - 'phase*'
      - 'theme*'
      - 'feat-*'
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast, network-free proof that the ports still agree with the website.
  # ---------------------------------------------------------------------------
  verify:
    name: Contract + parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # Cheapest gate first: a plain-Python structural check that catches the
      # class of mistake that has actually broken this build repeatedly —
      # mangled regex substitutions, stale tokens, symbols used without an
      # import, and `c` used in a scope that cannot resolve it. It runs in about
      # a second, before the ~90s a Flutter toolchain takes to boot.
      - name: Pre-flight audit
        run: python3 tools/audit.py .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit + contract + design-system tests
        run: flutter test --reporter expanded

  # ---------------------------------------------------------------------------
  # 2. The artifact. Only runs when job 1 is green.
  # ---------------------------------------------------------------------------
  apk:
    name: Release APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # 🔴 STAMP THE BUILD'S IDENTITY INTO THE BINARY.
      # Without this a shipped APK cannot say which build it is. During the
      # Amharic investigation that cost real time: the About page showed a
      # hardcoded 'v0.3' that had not changed in four builds, and a screenshot
      # cannot identify itself. NorchaVersion reads these two defines, and the
      # diagnostic banner displays them, so any screenshot now names its build.
      - name: Read VERSION
        id: ver
        run: |
          # Human version from the repo, build number from the run.
          # Neither alone is enough: VERSION says WHAT this is, the run
          # number says WHICH build of it. Together: 0.5.0+42
          V=$(head -n1 VERSION | tr -d "[:space:]")
          if [ -z "$V" ]; then echo "VERSION file is empty" >&2; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "stamp=$V+${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Norcha $V+${{ github.run_number }}"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=NORCHA_VERSION="${{ steps.ver.outputs.stamp }}" \
            --dart-define=NORCHA_SHA="${{ github.sha }}"

      - name: Stage artifact with a readable name
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/norcha-luxury-${{ github.run_number }}.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt
          cat out/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: norcha-luxury-apk
          path: out/*
          retention-days: 30

      # A release asset is how the phone actually gets the APK — downloading a
      # workflow artifact requires auth and a zip extract; a release asset is
      # one tap. This is the delivery path that matters.
      # 🔴 THE RELEASE IS THE DELIVERY PATH. `if:` used to be main-only, so a
      # build dispatched from pricing-real produced an artifact nobody could
      # install without auth + a zip extract — which is why the APK ended up
      # as a loose file in Downloads instead of a release asset.
      - name: Publish to a Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pricing-real'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-b${{ github.run_number }}
          name: Norcha ${{ steps.ver.outputs.version }} build ${{ github.run_number }}
          body: |
            Automated build from ${{ github.sha }}.

            Signed with the Android **debug** key on purpose — this is a
            sideload build for review, not a store submission. See README.
          files: |
            out/norcha-luxury-*.apk
            out/SHA256SUMS.txt
          draft: false
          prerelease: true

      # ───────────────────────────────────────────────────────────────────────
      # 🔴 MIRROR TO THE RELAY, BECAUSE GITHUB IS SLOW FROM ADDIS.
      #
      # Measured 2026-10-11 from the phone: a github.com release download ran at
      # 17 KB/s — 53 minutes for one APK — while the same phone pulled 2.8 MB/s
      # from Cloudflare and 3.8 MB/s from the relay on adwaaudit.com. GitHub is
      # the bottleneck, not the connection. So the build publishes itself to
      # somewhere fast and nobody waits, and nobody hand-copies an APK again.
      #
      # The relay serves https://adwaaudit.com/norcha/ from the adwa_frontend
      # container's web root. It has its own README in /home/ubuntu/norcha-relay.
      #
      # ⚠️ REQUIRES THE SECRET `NORCHA_RELAY_KEY`. The step SKIPS cleanly when it
      # is absent — a missing secret must never fail a build that otherwise
      # produced a good APK. Silent skip, never silent failure.
      - name: Mirror to the relay (adwaaudit.com/norcha)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pricing-real') && env.RELAY_KEY != ''
        env:
          RELAY_KEY: ${{ secrets.NORCHA_RELAY_KEY }}
        run: |
          set -euo pipefail
          NAME="norcha-print-v${{ steps.ver.outputs.version }}-b${{ github.run_number }}.apk"
          TAG="v${{ steps.ver.outputs.version }}-b${{ github.run_number }}"
          echo "mirroring $NAME from $TAG"

          # The relay pulls the file itself rather than the runner pushing it:
          # the VPS is on a fast link and this avoids pushing 55MB back up out
          # of a CI runner. It then regenerates its own index. Idempotent.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              -i <(printf '%s' "$RELAY_KEY") ubuntu@129.80.112.9 "
                set -e
                cd /home/ubuntu/norcha-relay
                curl -sL --max-time 300 -o '$NAME' \
                  'https://github.com/messaynew-cyber/norcha-android/releases/download/$TAG/norcha-luxury-${{ github.run_number }}.apk'
                python3 generate_index.py
                CT=\$(sudo docker ps -q --filter publish=80)
                sudo docker cp '$NAME' \$CT:/usr/share/nginx/html/norcha/
                sudo docker cp index.json \$CT:/usr/share/nginx/html/norcha/
                echo MIRRORED '$NAME'
              "

      - name: Where to download it
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pricing-real')
        run: |
          {
            echo "### Downloads"
            echo ""
            echo "- **Fast (relay):** https://adwaaudit.com/norcha/"
            echo "- Release: \`v${{ steps.ver.outputs.version }}-b${{ github.run_number }}\`"
            echo "- Version stamped into the APK: \`${{ steps.ver.outputs.stamp }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
