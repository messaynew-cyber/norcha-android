# Norcha Print — sample sideload APK build.
#
# 🔴 SCOPE GUARD: this workflow belongs to norcha-android ONLY.
#    It does not touch adwa-apk, adwaaudit.github.io, feven-prints-v2, or any
#    other repo. No shared secrets beyond the repo's own. No reusable-workflow
#    or composite-action references that could reach into another project.
#    Nothing here is triggered by another repo's events.

name: Norcha Sample APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'theme-*'
    paths-ignore:
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (this repo only)
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      # THE IMPORTANT STEP. Prices drift silently; this does not let them.
      - name: Parity tests — app must agree with the website
        run: flutter test

      - name: Build sample APK (release)
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             out/norcha-print-sample-${{ github.run_number }}.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: norcha-apk-${{ github.ref_name }}
          path: out/*.apk
          retention-days: 30
