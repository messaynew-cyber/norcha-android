# Fast feedback: analysis + the parity tests on every push, without building.
# Keeps the expensive APK job for when the code is actually green.
#
# 🔴 SCOPE GUARD: norcha-android only. No cross-repo triggers, no shared secrets.

name: Test

on:
  push:
    branches:
      - main
      - 'theme-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Parity tests
        run: flutter test --reporter expanded
