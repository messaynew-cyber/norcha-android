# Fast feedback: analysis + the parity tests on every push, without building.
# Keeps the expensive APK job for when the code is actually green.
#
# 🔴 SCOPE GUARD: norcha-android only. No cross-repo triggers, no shared secrets.

name: Test

on:
  push:
    branches:
      - main
      - 'theme-*'
      - 'phase1-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Parity tests (Dart)
        run: flutter test --reporter expanded

      # The Dart tests prove the Dart. They CANNOT prove the Dart still agrees
      # with the website it was ported from. This does — it parses the JS,
      # runs it with node, and compares constants, decision thresholds and
      # computed dates against the Dart source. Fasika was a week out for years
      # because nothing performed this check.
      - name: Cross-language parity (JS vs Dart)
        run: python3 tools/port_parity.py
