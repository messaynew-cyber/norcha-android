plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.norcha.print"
    compileSdk = 34
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // REQUIRED by flutter_local_notifications 17.x.
        //
        // The plugin uses java.time, which does not exist before API 26. Core
        // library desugaring back-ports it so the app can keep minSdk 23 and
        // still use the plugin. Without this the build fails at
        // :app:checkReleaseAarMetadata with:
        //     Dependency ':flutter_local_notifications' requires core library
        //     desugaring to be enabled
        //
        // This is documented in the plugin's own README. It is here with the
        // explanation because "desugaring" tells a future reader nothing about
        // why it was needed.
        isCoreLibraryDesugaringEnabled = true
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId = "com.norcha.print"
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Sideload build: signed with the release key when present, so that
            // build #2 installs cleanly OVER build #1. A per-run debug key would
            // force uninstall/reinstall on every update and wipe app data.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    // The desugaring runtime that pairs with isCoreLibraryDesugaringEnabled.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

flutter { source = "../.." }
